// ── Bell sound using Web Audio API ───────────────────────────────────────────
function playBell() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    // Bell tone 1
    const osc1 = ctx.createOscillator();
    const gain1 = ctx.createGain();
    osc1.connect(gain1); gain1.connect(ctx.destination);
    osc1.frequency.setValueAtTime(880, now);
    osc1.frequency.exponentialRampToValueAtTime(660, now + 0.4);
    gain1.gain.setValueAtTime(0.4, now);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    osc1.start(now); osc1.stop(now + 1.2);

    // Bell tone 2 (slight delay, harmony)
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2); gain2.connect(ctx.destination);
    osc2.frequency.setValueAtTime(1100, now + 0.1);
    osc2.frequency.exponentialRampToValueAtTime(880, now + 0.5);
    gain2.gain.setValueAtTime(0.25, now + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
    osc2.start(now + 0.1); osc2.stop(now + 1.4);
  } catch(e) {}
}

// ── TipsPanel ─────────────────────────────────────────────────────────────────
function TipsPanel({ vehicle, onClose }) {
  const tips = VEHICLE_TIPS[vehicle.id];
  return (
    <Overlay>
      <div style={{ background:"#16182A",borderRadius:16,width:"100%",maxWidth:440,border:"1px solid #2A2C40",display:"flex",flexDirection:"column",maxHeight:"85vh",overflow:"hidden" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"16px 18px",borderBottom:"1px solid #1E2030" }}>
          <div>
            <div style={{ fontWeight:700,fontSize:16,color:"#F0F0FA" }}>💡 Tips & Recalls</div>
            <div style={{ fontSize:12,color:"#8888AA",marginTop:2 }}>{vehicle.nickname} · {vehicle.year} {vehicle.make} {vehicle.model}</div>
          </div>
          <button onClick={onClose} style={{ background:"none",border:"none",color:"#8888AA",fontSize:18,cursor:"pointer" }}>✕</button>
        </div>
        <div style={{ overflowY:"auto",padding:"14px 16px",display:"flex",flexDirection:"column",gap:10 }}>

          {/* Tips section */}
          <div style={{ fontSize:11,color:"#8888AA",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:2 }}>Maintenance Tips</div>
          {tips.highlights.map((tip, i) => (
            <div key={i} style={{ display:"flex",gap:12,background:"#1E2030",borderRadius:10,padding:"12px 14px",alignItems:"flex-start" }}>
              <div style={{ fontSize:22,flexShrink:0 }}>{tip.icon}</div>
              <div>
                <div style={{ fontWeight:700,fontSize:13,color:vehicle.color,marginBottom:4 }}>{tip.title}</div>
                <div style={{ fontSize:13,color:"#CCCCDD",lineHeight:1.5 }}>{tip.body}</div>
              </div>
            </div>
          ))}

          {/* Recalls section */}
          {tips.recalls && tips.recalls.length > 0 && <>
            <div style={{ fontSize:11,color:"#FF6B6B",fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginTop:6,marginBottom:2 }}>⚠️ Known Recalls ({tips.recalls.length})</div>
            <div style={{ fontSize:11,color:"#8888AA",marginBottom:4,lineHeight:1.4 }}>Recalls are free to fix at any dealership. Check your VIN at <span style={{ color:vehicle.color }}>tc.canada.ca/recalls</span> to confirm if your specific car is affected.</div>
            {tips.recalls.map((recall, i) => (
              <div key={i} style={{ display:"flex",gap:12,background:"#1A0A0A",borderRadius:10,padding:"12px 14px",alignItems:"flex-start",border:"1px solid #3A1A1A" }}>
                <div style={{ fontSize:20,flexShrink:0 }}>{recall.icon}</div>

                  <div style={{ fontSize:11,color:"#666688",fontStyle:"italic" }}>{recall.ref}</div>
                </div>
              </div>
            ))}
          </>}

        </div>
      </div>
    </Overlay>
  );
}

  const set = (k,v) => setForm(f => ({ ...f, [k]:v }));
  return (
    <Overlay>
      <div style={{ background:"#16182A",borderRadius:16,padding:24,width:"100%",maxWidth:400,border:"1px solid #2A2C40",maxHeight:"90vh",overflowY:"auto" }}>

            <div style={{ display:"flex",gap:8 }}>
              <input style={{ ...iStyle,flex:1 }} placeholder="e.g. Diff Oil, Cambelt..." value={form.service} onChange={e=>set("service",e.target.value)} autoFocus/>
              <button onClick={()=>{ set("useCustom",false); set("service","Oil Change"); }} style={{ ...cancelBtn,flex:"none",padding:"8px 10px",fontSize:12 }}>↩</button>
            </div>
          ) : (
            <div style={{ display:"flex",gap:8 }}>
              <select style={{ ...iStyle,flex:1 }} value={form.service} onChange={e=>set("service",e.target.value)}>{SERVICE_TYPES.map(s=><option key={s}>{s}</option>)}</select>
              <button onClick={()=>{ set("useCustom",true); set("service",""); }} style={{ ...saveBtn,flex:"none",padding:"8px 10px",fontSize:12 }} title="Type a custom service">✎</button>
            </div>
          )}
        </label>
        <label style={lStyle}>Mileage (km)<input style={iStyle} type="number" placeholder="e.g. 45000" value={form.mileage} onChange={e=>set("mileage",e.target.value)}/></label>
        <label style={lStyle}>Cost ($)<input style={iStyle} type="number" placeholder="0.00" value={form.cost} onChange={e=>set("cost",e.target.value)}/></label>
        <label style={{ display:"flex",flexDirection:"column",gap:4,marginBottom:12,fontSize:13,color:"#AAAACC",fontWeight:600 }}>
          Notes

// ── VehicleCard ───────────────────────────────────────────────────────────────
function VehicleCard({ vehicle, selected, onClick, onMileageUpdate, onNicknameUpdate, monthlyMaint, monthlyFuel, hasDue }) {
  const [editingKm, setEditingKm] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const [km, setKm] = useState(vehicle.mileage);
  const [nickname, setNickname] = useState(vehicle.nickname);

  const handleMileageTap = e => { if (!selected) return; e.stopPropagation(); setEditingKm(true); setKm(vehicle.mileage); };
  const handleSaveKm = e => { e.stopPropagation(); if (Number(km)>0) onMileageUpdate(Number(km)); setEditingKm(false); };

  const handleNicknameTap = e => { if (!selected) return; e.stopPropagation(); setEditingName(true); setNickname(vehicle.nickname); };
  const handleSaveName = e => { e.stopPropagation(); if (nickname.trim()) onNicknameUpdate(nickname.trim()); setEditingName(false); };

  return (
    <div onClick={onClick} style={{ display:"flex",flexDirection:"column",background:selected?"#1C1E30":"#16182A",borderRadius:14,border:`2px solid ${selected?vehicle.color:"transparent"}`,cursor:"pointer",flex:1,minWidth:0,overflow:"hidden",transform:selected?"translateY(-2px)":"none",transition:"all .2s",boxShadow:selected?`0 6px 20px ${vehicle.color}33`:"none" }}>
      {/* Photo — fully contained */}
      <div style={{ width:"100%",height:86,overflow:"hidden",background:"#0D0F1A",flexShrink:0 }}
        dangerouslySetInnerHTML={{ __html: CAR_SVGS[vehicle.id] || "" }}/>
      {/* Colour stripe */}
      <div style={{ height:3,background:vehicle.color,flexShrink:0 }}/>
      {/* Info */}
      <div style={{ padding:"8px 10px 10px" }}>
        {selected && editingName ? (
          <div style={{ display:"flex",gap:4,marginBottom:4 }} onClick={e=>e.stopPropagation()}>
            <input autoFocus value={nickname} onChange={e=>setNickname(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSaveName(e)}
              style={{ ...iStyle,padding:"3px 6px",fontSize:12,fontWeight:700,flex:1 }}/>
            <button onClick={handleSaveName} style={{ ...saveBtn,padding:"3px 8px",fontSize:11 }}>✓</button>
          </div>
        ) : (
          <div onClick={handleNicknameTap} style={{ fontWeight:800,fontSize:13,color:"#F0F0FA",cursor:selected?"text":"default",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",display:"flex",alignItems:"center",gap:4 }}>
            <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{vehicle.nickname}{selected?" ✎":""}</span>
            {hasDue && <span style={{fontSize:12,flexShrink:0,animation:"bellring 1s ease infinite"}} title="Reminder due!">🔔</span>}
          </div>
        )}
        <div style={{ fontSize:10,color:"#8888AA",marginTop:1,marginBottom:4 }}>{vehicle.year} {vehicle.make}</div>
        {selected && editingKm ? (
          <div style={{ display:"flex",gap:4 }} onClick={e=>e.stopPropagation()}>
            <input autoFocus type="number" value={km} onChange={e=>setKm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSaveKm(e)}
              style={{ ...iStyle,padding:"3px 6px",fontSize:11,flex:1 }}/>
            <button onClick={handleSaveKm} style={{ ...saveBtn,padding:"3px 8px",fontSize:11 }}>✓</button>
          </div>
        ) : (
          <div onClick={handleMileageTap} style={{ fontSize:11,fontWeight:700,color:selected?vehicle.color:"#AAAACC",cursor:selected?"text":"default" }}>
            {fmtKm(vehicle.mileage)}{selected?" ✎":""}
          </div>
        )}
        {(monthlyMaint+monthlyFuel)>0 && (
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6,borderTop:"1px solid #1E2030",paddingTop:6 }}>
            <div style={{ fontSize:9,color:"#6666AA",fontWeight:700,textTransform:"uppercase",letterSpacing:0.4 }}>Avg/mo</div>
            <div style={{ fontSize:12,fontWeight:800,color:vehicle.color }}>${(monthlyMaint+monthlyFuel).toFixed(0)}</div>
          </div>
        )}

  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [vehicles, setVehiclesRaw] = useState(() => load("at_vehicles", INITIAL_VEHICLES));
  const [fuel, setFuelRaw] = useState(() => load("at_fuel", {1:[],2:[],3:[]}));
  const [logs, setLogsRaw] = useState(() => load("at_logs", INITIAL_LOGS));
  const [reminders, setRemindersRaw] = useState(() => load("at_reminders", INITIAL_REMINDERS));
  const [selectedId, setSelectedId] = useState(1);
  const [tab, setTab] = useState("history");
  const [showLogModal, setShowLogModal] = useState(false);
  const [showReminderModal, setShowReminderModal] = useState(false);
  const [showTips, setShowTips] = useState(false);
  const [editingLog, setEditingLog] = useState(null);
  const [editingReminder, setEditingReminder] = useState(null);
  const [showFuelModal, setShowFuelModal] = useState(false);
  const [editingFuel, setEditingFuel] = useState(null);

  const setVehicles = v => { const val = typeof v==="function"?v(vehicles):v; save("at_vehicles",val); setVehiclesRaw(val); };
  const setLogs = v => { const val = typeof v==="function"?v(logs):v; save("at_logs",val); setLogsRaw(val); };
  const setReminders = v => { const val = typeof v==="function"?v(reminders):v; save("at_reminders",val); setRemindersRaw(val); };
  const setFuel = v => { const val = typeof v==="function"?v(fuel):v; save("at_fuel",val); setFuelRaw(val); };

  const vehicle = vehicles.find(v=>v.id===selectedId);
  const vLogs = logs[selectedId]||[];
  const vReminders = reminders[selectedId]||[];

  const saveLog = form => {
    const entry = { ...form, id:editingLog?editingLog.id:Date.now(), mileage:Number(form.mileage), cost:Number(form.cost) };
    setLogs(prev => { const list=prev[selectedId]||[]; const updated=editingLog?list.map(l=>l.id===entry.id?entry:l):[entry,...list]; return {...prev,[selectedId]:updated.sort((a,b)=>b.date.localeCompare(a.date))}; });
    setShowLogModal(false); setEditingLog(null);
  };

  const deleteLog = id => setLogs(prev=>({...prev,[selectedId]:prev[selectedId].filter(l=>l.id!==id)}));

  const saveReminder = form => {
    const entry = { ...form, dueMileage: Number(form.dueMileage) };
    if (editingReminder) {
      setReminders(prev=>({...prev,[selectedId]:prev[selectedId].map(r=>r.id===editingReminder.id?{...entry,id:editingReminder.id}:r)}));
    } else {
      setReminders(prev=>({...prev,[selectedId]:[...(prev[selectedId]||[]),{...entry,id:Date.now()}]}));
    }
    setShowReminderModal(false);
    setEditingReminder(null);
  };

  const toggleReminder = id => setReminders(prev=>({...prev,[selectedId]:prev[selectedId].map(r=>r.id===id?{...r,done:!r.done}:r)}));
  const deleteReminder = id => setReminders(prev=>({...prev,[selectedId]:prev[selectedId].filter(r=>r.id!==id)}));

  const vFuel = fuel[selectedId] || [];

  const saveFuelEntry = form => {
    const entry = { ...form, id: editingFuel ? editingFuel.id : Date.now(), litres: Number(form.litres), cost: Number(form.cost), mileage: Number(form.mileage) };
    setFuel(prev => {
      const list = prev[selectedId] || [];
      const updated = editingFuel ? list.map(f => f.id === entry.id ? entry : f) : [entry, ...list];
      return { ...prev, [selectedId]: updated.sort((a,b) => b.date.localeCompare(a.date)) };
    });
    // Auto-update vehicle mileage if fill-up km is higher than current
    if (entry.mileage) {
      setVehicles(prev => prev.map(v => v.id === selectedId && entry.mileage > v.mileage ? { ...v, mileage: entry.mileage } : v));
    }
    setShowFuelModal(false); setEditingFuel(null);
  };

  const deleteFuelEntry = id => setFuel(prev => ({ ...prev, [selectedId]: prev[selectedId].filter(f => f.id !== id) }));

  const fuelWeeklyAvg = () => {
    if (vFuel.length < 2) return null;
    const sorted = [...vFuel].sort((a,b) => a.date.localeCompare(b.date));
    const first = new Date(sorted[0].date);
    const last = new Date(sorted[sorted.length-1].date);
    const weeks = Math.max(1, (last - first) / (1000 * 60 * 60 * 24 * 7));
    const total = vFuel.reduce((s,f) => s + Number(f.cost||0), 0);
    return (total / weeks).toFixed(2);
  };

  const fuelTotalCost = vFuel.reduce((s,f) => s + Number(f.cost||0), 0);
  const fuelTotalLitres = vFuel.reduce((s,f) => s + Number(f.litres||0), 0);
  const avgCostPerLitre = fuelTotalLitres > 0 ? (fuelTotalCost / fuelTotalLitres).toFixed(3) : null;

  const costByType = vLogs.reduce((acc,l)=>{ acc[l.service]=(acc[l.service]||0)+Number(l.cost||0); return acc; },{});
  const sortedCosts = Object.entries(costByType).sort((a,b)=>b[1]-a[1]);
  const sched = MAINTENANCE_SCHEDULES[selectedId];

  const TABS = [["history","📋 History"],["reminders","🔔 Reminders"],["costs","💰 Costs"],["fuel","⛽ Fuel"],["schedule","📅 Schedule"],["diy","🎬 DIY"]];

  return (
    <div style={{ fontFamily:"-apple-system,system-ui,sans-serif",background:"#0F1117",minHeight:"100vh",color:"#E8E8F0",maxWidth:680,margin:"0 auto",paddingBottom:40,overflowX:"hidden",width:"100%" }}>

      {/* Header */}
      <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 12px",borderBottom:"1px solid #1E2030" }}>
        <div style={{ display:"flex",alignItems:"center",gap:10 }}>
          <span style={{ lineHeight:0 }} dangerouslySetInnerHTML={{ __html: `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='28' height='28'>
  <circle cx='16' cy='16' r='14' fill='none' stroke='#F0F0F0' stroke-width='2.5'/>
  <circle cx='16' cy='16' r='5' fill='none' stroke='#F0F0F0' stroke-width='2.2'/>
  <line x1='16' y1='2' x2='16' y2='11' stroke='#F0F0F0' stroke-width='2.2' stroke-linecap='round'/>
  <line x1='16' y1='21' x2='16' y2='30' stroke='#F0F0F0' stroke-width='2.2' stroke-linecap='round'/>
  <line x1='2' y1='16' x2='11' y2='16' stroke='#F0F0F0' stroke-width='2.2' stroke-linecap='round'/>
  <line x1='21' y1='16' x2='30' y2='16' stroke='#F0F0F0' stroke-width='2.2' stroke-linecap='round'/>
</svg>` }}/>
          <span style={{ fontSize:22,fontWeight:700,letterSpacing:-0.5,color:"#F0F0FA" }}>AutoTrack</span>
        </div>
        <button style={{ padding:"8px 16px",borderRadius:20,border:"none",color:"#fff",fontWeight:600,fontSize:13,cursor:"pointer",background:vehicle?.color }} onClick={()=>setShowTips(true)}>
          💡 Tips
        </button>
      </div>

      {/* Vehicle Selector */}
      <div style={{ display:"flex",gap:8,padding:"12px 16px",overflowX:"auto" }}>
        {vehicles.map(v=>{
          // Monthly maintenance cost
          const vl = logs[v.id]||[];
          const maintMonthly = (() => {
            if (vl.length < 2) return 0;
            const sorted = [...vl].sort((a,b)=>a.date.localeCompare(b.date));
            const months = Math.max(1,(new Date(sorted[sorted.length-1].date)-new Date(sorted[0].date))/(1000*60*60*24*30.5));
            return (vl.reduce((s,l)=>s+Number(l.cost||0),0)/months).toFixed(0);
          })();
          // Monthly fuel cost
          const vf = fuel[v.id]||[];
          const fuelMonthly = (() => {
            if (vf.length < 2) return 0;
            const sorted = [...vf].sort((a,b)=>a.date.localeCompare(b.date));
            const months = Math.max(1,(new Date(sorted[sorted.length-1].date)-new Date(sorted[0].date))/(1000*60*60*24*30.5));
            return (vf.reduce((s,f)=>s+Number(f.cost||0),0)/months).toFixed(0);
          })();
          // Check if any reminders are due within 1500km or 30 days
          const vRem = reminders[v.id] || [];
          const today = new Date();
          const hasDue = vRem.some(r => {
            if (r.done) return false;
            const kmDue = r.dueMileage && (r.dueMileage - v.mileage) <= 1500 && (r.dueMileage - v.mileage) >= 0;
            const dateDue = r.dueDate && (new Date(r.dueDate) - today) / (1000*60*60*24) <= 30 && new Date(r.dueDate) >= today;
            const overdue = (r.dueMileage && v.mileage >= r.dueMileage) || (r.dueDate && new Date(r.dueDate) < today);
            return kmDue || dateDue || overdue;
          });
          return (
            <VehicleCard key={v.id} vehicle={v} selected={v.id===selectedId}
              hasDue={hasDue}
              onClick={()=>{ setSelectedId(v.id); }}
              monthlyMaint={Number(maintMonthly)} monthlyFuel={Number(fuelMonthly)}
              onMileageUpdate={km=>setVehicles(prev=>prev.map(x=>x.id===v.id?{...x,mileage:km}:x))}
              onNicknameUpdate={name=>setVehicles(prev=>prev.map(x=>x.id===v.id?{...x,nickname:name}:x))} />
          );
        })}
      </div>

      {/* Tab Bar — 2 rows of 3 */}
      <div style={{ margin:"0 16px",borderBottom:"1px solid #1E2030" }}>
        {[TABS.slice(0,3), TABS.slice(3)].map((row, ri) => (
          <div key={ri} style={{ display:"flex" }}>
            {row.map(([key,label])=>(
              <button key={key} onClick={()=>setTab(key)} style={{ flex:1,padding:"9px 0",background:"none",border:"none",borderBottom:tab===key?`2px solid ${vehicle?.color}`:"2px solid transparent",color:tab===key?vehicle?.color:"#6666AA",fontWeight:600,fontSize:12,cursor:"pointer",borderTop:ri===1?"1px solid #1E2030":"none" }}>
                {label}
              </button>
            ))}
          </div>
        ))}
      </div>

      {/* Content */}
      <div style={{ padding:"14px 16px",boxSizing:"border-box",width:"100%",overflowX:"hidden" }}>

        {/* HISTORY */}
        {tab==="history" && <>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
            <span style={sectionTitle}>{vLogs.length} records</span>
            <button style={{ ...addBtn,background:vehicle?.color }} onClick={()=>{ setEditingLog(null); setShowLogModal(true); }}>+ Log Service</button>
          </div>
          {vLogs.length===0 && <div style={empty}>No service records yet. Log your first service!</div>}
          {vLogs.map(log=>(
            <LogCard key={log.id} log={log} color={vehicle?.color}
              onEdit={()=>{ setEditingLog(log); setShowLogModal(true); }}
              onDelete={()=>deleteLog(log.id)}
              onSaveNotes={notes=>setLogs(prev=>({...prev,[selectedId]:prev[selectedId].map(l=>l.id===log.id?{...l,notes}:l)}))}
            />
          ))}
        </>}

        {/* REMINDERS */}
        {tab==="reminders" && <>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
            <span style={sectionTitle}>{vReminders.filter(r=>!r.done).length} upcoming</span>
            <button style={{ ...addBtn,background:vehicle?.color }} onClick={()=>setShowReminderModal(true)}>+ Add</button>
          </div>
          {vReminders.length===0 && <div style={empty}>No reminders set.</div>}
          {vReminders.map(r=>(
            <div key={r.id} style={{ background:"#16182A",borderRadius:10,padding:"12px 14px",marginBottom:8,opacity:r.done?0.5:1 }}>
              <div style={{ display:"flex",alignItems:"center",gap:12 }}>
                <input type="checkbox" checked={r.done} onChange={()=>toggleReminder(r.id)} style={{ width:18,height:18,cursor:"pointer",flexShrink:0 }} />
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:600,fontSize:14,color:"#F0F0FA",textDecoration:r.done?"line-through":"none" }}>{r.service}</div>
                  <div style={{ fontSize:12,color:"#8888AA",marginTop:2 }}>
                    {r.dueDate&&`📅 ${r.dueDate}`}{r.dueDate&&r.dueMileage?" · ":""}{r.dueMileage?`🛣️ ${fmtKm(r.dueMileage)}`:""}
                  </div>
                  {r.notes && <div style={{ fontSize:12,color:"#AAAACC",marginTop:4,fontStyle:"italic" }}>{r.notes}</div>}
                </div>
                <div style={{ display:"flex",gap:6,flexShrink:0 }}>
                  <button style={{ background:"none",border:"none",cursor:"pointer",fontSize:14 }} onClick={()=>{ setEditingReminder(r); setShowReminderModal(true); }}>✏️</button>
                  <button style={{ background:"none",border:"none",cursor:"pointer",fontSize:14 }} onClick={()=>deleteReminder(r.id)}>🗑️</button>
                </div>
              </div>
            </div>
          ))}
        </>}

        {/* COSTS */}
        {tab==="costs" && <>
          <div style={{ display:"flex",gap:8,marginBottom:14,width:"100%" }}>
            {[["Total Spent",fmt$(totalCost(vLogs))],["Services",vLogs.length],["Avg Cost",vLogs.length?fmt$(totalCost(vLogs)/vLogs.length):"$0"]].map(([l,v])=>(
              <div key={l} style={{ flex:1,background:"#16182A",borderRadius:10,padding:"10px 6px",textAlign:"center",minWidth:0 }}>
                <div style={{ fontSize:9,color:"#8888AA",fontWeight:600,textTransform:"uppercase",letterSpacing:0.3,marginBottom:3 }}>{l}</div>
                <div style={{ fontSize:16,fontWeight:800,letterSpacing:-0.5,color:vehicle?.color }}>{v}</div>
              </div>
            ))}
          </div>
          <div style={sectionTitle}>By Service Type</div>
          {sortedCosts.length===0 && <div style={empty}>No cost data yet.</div>}
          {sortedCosts.map(([service,cost])=>{
            const pct=totalCost(vLogs)?Math.round(cost/totalCost(vLogs)*100):0;
            return (
              <div key={service} style={{ background:"#16182A",borderRadius:10,padding:"11px 12px",marginBottom:8,overflow:"hidden",boxSizing:"border-box",width:"100%" }}>
                <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8 }}>
                  <span style={{ fontSize:13,fontWeight:600,color:"#F0F0FA",flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>{service}</span>
                  <span style={{ fontSize:13,fontWeight:700,flexShrink:0 }}>{fmt$(cost)}</span>
                </div>
                <div style={{ height:5,background:"#1E2030",borderRadius:3,overflow:"hidden",width:"100%" }}>
                  <div style={{ height:"100%",borderRadius:3,width:`${pct}%`,maxWidth:"100%",background:vehicle?.color,transition:"width .5s" }} />
                </div>
              </div>
            );
          })}
        </>}

        {/* FUEL */}
        {tab==="fuel" && (() => {
          const weekly = fuelWeeklyAvg();
          const sorted = [...vFuel].sort((a,b)=>b.date.localeCompare(a.date));
          // L/km: total litres / total km driven
          const kmDriven = sorted.length >= 2 ? Number(sorted[0].mileage||0) - Number(sorted[sorted.length-1].mileage||0) : 0;
          const lPerKm = kmDriven > 0 ? (fuelTotalLitres / kmDriven).toFixed(3) : null;

          return (
            <>
              {/* Quick entry form */}
              <FuelQuickEntry color={vehicle?.color} onSave={saveFuelEntry} currentMileage={vehicle?.mileage} />

              {/* Stats */}
              <div style={{ display:"flex",gap:10,margin:"16px 0",flexWrap:"wrap" }}>
                {[
                  ["Weekly Avg Cost", weekly ? `$${weekly}` : "—"],
                  ["Avg L/km", lPerKm ? `${lPerKm}` : "—"],
                  ["Cost Per Litre", avgCostPerLitre ? `$${avgCostPerLitre}` : "—"],
                ].map(([label,value])=>(
                  <div key={label} style={{ flex:1,minWidth:90,background:"#16182A",borderRadius:10,padding:"12px 10px",textAlign:"center" }}>
                    <div style={{ fontSize:10,color:"#8888AA",fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6 }}>{label}</div>
                    <div style={{ fontSize:22,fontWeight:800,color:vehicle?.color,letterSpacing:-0.5 }}>{value}</div>
                  </div>
                ))}
              </div>

              {/* History */}
              {vFuel.length > 0 && <>
                <div style={{ ...sectionTitle, marginBottom:10 }}>Fill-up history</div>
                {sorted.map((f,i) => (
                  <div key={f.id} style={{ display:"flex",alignItems:"center",gap:10,background:"#16182A",borderRadius:10,padding:"12px 14px",marginBottom:8 }}>
                    <div style={{ width:8,height:8,borderRadius:"50%",background:vehicle?.color,flexShrink:0 }}/>
                    <div style={{ flex:1 }}>
                      <div style={{ display:"flex",justifyContent:"space-between" }}>
                        <span style={{ fontWeight:600,fontSize:14,color:"#F0F0FA" }}>{f.date}</span>
                        <span style={{ fontWeight:700,fontSize:14,color:"#F0F0FA" }}>{fmt$(f.cost)}</span>
                      </div>
                      <div style={{ fontSize:12,color:"#8888AA",marginTop:2 }}>
                        ⛽ {Number(f.litres).toFixed(1)}L{f.mileage ? ` · 🛣️ ${fmtKm(f.mileage)}` : ""}{f.litres && f.cost ? ` · $${(Number(f.cost)/Number(f.litres)).toFixed(3)}/L` : ""}
                      </div>
                    </div>
                    <button style={{ background:"none",border:"none",cursor:"pointer",fontSize:14 }} onClick={()=>deleteFuelEntry(f.id)}>🗑️</button>
                  </div>
                ))}
              </>}
              {vFuel.length === 0 && <div style={empty}>Log your first fill-up above!</div>}
            </>
          );
        })()}

        {/* SCHEDULE */}
        {tab==="schedule" && sched && <>
          <div style={{ background:"#16182A",borderRadius:10,padding:"12px 14px",marginBottom:14 }}>
            <div style={{ fontWeight:700,fontSize:13,color:"#F0F0FA",marginBottom:6 }}>{sched.source}</div>
            <div style={{ fontSize:12,color:"#8888AA",lineHeight:1.5 }}>{sched.notes}</div>
          </div>
          {sched.intervals.map((interval,i)=>{
            const isOverdue = interval.km && vehicle.mileage >= interval.km;
            const isDue = interval.km && vehicle.mileage >= interval.km-8000 && !isOverdue;
            const borderColor = isOverdue?"#E84545":isDue?"#F4A261":vehicle?.color;
            return (
              <div key={i} style={{ background:"#16182A",borderRadius:10,padding:"12px 14px",marginBottom:10,borderLeft:`3px solid ${borderColor}` }}>
                <div style={{ fontWeight:700,fontSize:13,color:borderColor,marginBottom:8 }}>
                  {interval.label}{isOverdue?" ⚠️ Past due":isDue?" 🔔 Coming up":""}
                </div>
                <ul style={{ margin:0,paddingLeft:18 }}>
                  {interval.services.map((s,j)=><li key={j} style={{ fontSize:13,color:"#CCCCDD",marginBottom:4,lineHeight:1.4 }}>{s}</li>)}
                </ul>
              </div>
            );
          })}
          <div style={{ fontSize:12,color:"#6666AA",textAlign:"center",marginTop:16 }}>
            Source: <a href={sched.sourceUrl} target="_blank" rel="noopener noreferrer" style={{ color:vehicle?.color }}>Official manufacturer schedule ↗</a>
          </div>
        </>}

        {/* DIY VIDEOS */}
        {tab==="diy" && (() => {
          const videos = DIY_VIDEOS[selectedId]?.videos || [];
          const categories = [...new Set(videos.map(v => v.category))];
          return (
            <>
              <div style={{ ...sectionTitle, marginBottom:14 }}>{videos.length} DIY videos · {vehicle?.make} {vehicle?.model}</div>
              {categories.map(cat => (
                <div key={cat}>
                  <div style={{ fontSize:11,fontWeight:700,color:"#6666AA",textTransform:"uppercase",letterSpacing:1,marginBottom:8,marginTop:12 }}>{cat}</div>
                  {videos.filter(v=>v.category===cat).map((v,i) => (
                    <a key={i} href={v.url} target="_blank" rel="noopener noreferrer" style={{ display:"flex",alignItems:"center",gap:14,background:"#16182A",borderRadius:10,padding:"14px",marginBottom:8,textDecoration:"none",border:"1px solid #1E2030",WebkitTapHighlightColor:"transparent" }}>
                      <div style={{ width:44,height:44,borderRadius:10,background:vehicle?.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0 }}>{v.icon}</div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontWeight:700,fontSize:13,color:"#F0F0FA",marginBottom:3 }}>{v.title}</div>
                        <div style={{ fontSize:12,color:"#8888AA",lineHeight:1.4 }}>{v.desc}</div>
                      </div>
                      <div style={{ fontSize:18,color:vehicle?.color,flexShrink:0 }}>▶</div>
                    </a>
                  ))}
                </div>
              ))}
              <div style={{ fontSize:12,color:"#6666AA",textAlign:"center",marginTop:16 }}>Tap any card to open on YouTube</div>
            </>
          );
        })()}


      </div>

      {/* Modals */}
      {showLogModal && <LogModal existing={editingLog} onSave={saveLog} onClose={()=>{ setShowLogModal(false); setEditingLog(null); }} />}
      {showFuelModal && <FuelModal existing={editingFuel} onSave={saveFuelEntry} onClose={()=>{ setShowFuelModal(false); setEditingFuel(null); }} />}
      {showReminderModal && <ReminderModal existing={editingReminder} onSave={saveReminder} onClose={()=>{ setShowReminderModal(false); setEditingReminder(null); }} />}
      {showFuelModal && <FuelModal existing={editingFuel} onSave={saveFuelEntry} onClose={()=>{ setShowFuelModal(false); setEditingFuel(null); }} />}
      {showTips && <TipsPanel vehicle={vehicle} onClose={()=>setShowTips(false)} />}
    </div>
  );
}

// ── Shared style constants ────────────────────────────────────────────────────
const iStyle = { padding:"9px 10px",borderRadius:8,border:"1px solid #2A2C40",background:"#0F1117",color:"#E8E8F0",fontSize:13,outline:"none",width:"100%",minWidth:0,boxSizing:"border-box" };
const lStyle = { display:"flex",flexDirection:"column",gap:4,marginBottom:12,fontSize:13,color:"#AAAACC",fontWeight:600 };
const saveBtn = { flex:1,padding:10,borderRadius:8,border:"none",background:"#4A6CF7",color:"#fff",fontWeight:600,cursor:"pointer" };
const cancelBtn = { flex:1,padding:10,borderRadius:8,border:"1px solid #2A2C40",background:"none",color:"#AAAACC",fontWeight:600,cursor:"pointer" };
const sectionTitle = { fontSize:13,color:"#8888AA",fontWeight:600,textTransform:"uppercase",letterSpacing:0.5 };
const addBtn = { padding:"7px 14px",borderRadius:8,border:"none",color:"#fff",fontWeight:600,fontSize:13,cursor:"pointer" };
const empty = { color:"#6666AA",textAlign:"center",padding:"40px 20px",fontSize:14 };

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
